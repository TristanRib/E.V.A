[project]
name = "eva"
version = "0.1.0"
description = "E.V.A — Entité Virtuelle d'Assistance : assistant personnel piloté par LLM."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tristan Riboulet" }]
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
eva = "eva.__main__:main"
eva-hue-pair = "eva.plugins.hue.pairing:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

# --- Lint & format ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "B",        # bugbear
    "UP",       # syntaxe Python moderne
    "SIM",      # simplifications
    "RUF",      # règles propres à ruff
]
allowed-confusables = ["›"]  # chevron utilisé volontairement dans l'interface CLI

# --- Typage -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# --- Tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # rend `fakes` (doublures de test partagées) importable
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
